<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공공부문 생성형 AI 도입 전략 - Slide 01</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --color-primary: #10B981;
    --color-primary-deep: #047857;
    --color-primary-soft: #DFF8EE;
    --color-primary-bg: #F1FBF6;
    --color-text: #14201B;
    --color-text-muted: #476158;
    --color-text-subtle: #8AA09A;
    --color-line: #CFE1DA;
    --color-line-soft: #EAF2EF;
    --color-surface: #FFFFFF;
    --color-surface-muted: #F7FAF8;
    --color-page-bg: #E6EEE9;
    --color-success: #16A34A;
    --color-warning: #F97316;
    --color-violet: #6366F1;
  }
  html,
  body {
    font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--color-page-bg);
    color: var(--color-text);
    -webkit-font-smoothing: antialiased;
    word-break: keep-all;
  }
  .deck {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
  }
  .slide {
    width: 1280px;
    height: 720px;
    background:
      linear-gradient(90deg, rgba(241, 251, 246, 0.92) 0%, rgba(255, 255, 255, 0.98) 48%, rgba(255, 255, 255, 1) 100%),
      radial-gradient(circle at 12% 18%, rgba(16, 185, 129, 0.18), transparent 34%),
      var(--color-surface);
    border-radius: 18px;
    box-shadow: 0 18px 54px rgba(20, 32, 27, 0.12);
    padding: 58px 70px 54px;
    position: relative;
    overflow: hidden;
  }
  .topline {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 750;
    color: var(--color-text-subtle);
  }
  .section-label {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--color-primary-deep);
  }
  .section-label::before {
    content: "";
    width: 28px;
    height: 2px;
    background: var(--color-primary);
  }
  .brand {
    color: var(--color-text-subtle);
  }
  .content {
    display: grid;
    grid-template-columns: 1.08fr 0.92fr;
    gap: 58px;
    height: calc(100% - 30px);
    align-items: center;
  }
  .title-wrap {
    padding-top: 12px;
  }
  h1 {
    font-size: 52px;
    line-height: 1.12;
    font-weight: 850;
    letter-spacing: 0;
    max-width: 640px;
  }
  .subtitle {
    margin-top: 24px;
    max-width: 590px;
    font-size: 21px;
    line-height: 1.52;
    font-weight: 560;
    color: var(--color-text-muted);
  }
  .thesis {
    margin-top: 38px;
    border-left: 4px solid var(--color-primary);
    padding: 8px 0 8px 22px;
    max-width: 615px;
    font-size: 25px;
    line-height: 1.42;
    font-weight: 760;
  }
  .accent {
    color: var(--color-primary-deep);
  }
  .right-panel {
    border: 1px solid var(--color-line);
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.78);
    padding: 30px 30px 26px;
    box-shadow: 0 12px 32px rgba(20, 32, 27, 0.07);
  }
  .panel-title {
    font-size: 15px;
    font-weight: 800;
    color: var(--color-text-muted);
    margin-bottom: 20px;
  }
  .keyword {
    display: grid;
    grid-template-columns: 86px 1fr;
    gap: 18px;
    padding: 19px 0;
    border-top: 1px solid var(--color-line-soft);
  }
  .keyword:first-of-type {
    border-top: 2px solid var(--color-text);
  }
  .keyword-name {
    font-size: 20px;
    font-weight: 850;
    color: var(--color-primary-deep);
  }
  .keyword-desc {
    font-size: 18px;
    line-height: 1.45;
    font-weight: 620;
    color: var(--color-text);
    overflow-wrap: normal;
  }
  .presenter {
    position: absolute;
    right: 70px;
    bottom: 54px;
    text-align: right;
    font-size: 15px;
    line-height: 1.7;
    font-weight: 650;
    color: var(--color-text-muted);
  }
  .presenter strong {
    display: block;
    color: var(--color-text);
    font-size: 18px;
    font-weight: 830;
  }
  .slide-num {
    position: absolute;
    left: 70px;
    bottom: 54px;
    font-size: 13px;
    font-weight: 720;
    color: var(--color-text-subtle);
  }
</style>
</head>
<body>
  <main class="deck">
    <section class="slide" aria-label="공공부문 생성형 AI 도입 전략 표지">
      <div class="topline">
        <div class="section-label">PUBLIC AI STRATEGY</div>
        <div class="brand">NIA · AI기술전략팀</div>
      </div>

      <div class="content">
        <div class="title-wrap">
          <h1>공공부문<br>생성형 AI<br><span class="accent">도입 전략</span></h1>
          <p class="subtitle">안전성, 생산성, 국민 체감도를 함께 높이는 단계적 확산 방향</p>
          <p class="thesis">기술 실험을 넘어, 신뢰 가능한 행정 운영 체계로 전환해야 합니다.</p>
        </div>

        <aside class="right-panel">
          <div class="panel-title">전략 키워드</div>
          <div class="keyword">
            <div class="keyword-name">Trust</div>
            <div class="keyword-desc">책임성과 검증 체계를 먼저 세웁니다.</div>
          </div>
          <div class="keyword">
            <div class="keyword-name">Scale</div>
            <div class="keyword-desc">공통 기반과 표준화를 통해 재사용성을 높입니다.</div>
          </div>
          <div class="keyword">
            <div class="keyword-name">Impact</div>
            <div class="keyword-desc">현장 업무와 국민 서비스 개선에 집중합니다.</div>
          </div>
        </aside>
      </div>

      <div class="slide-num">01 / 02</div>
      <div class="presenter">
        한국지능정보사회진흥원 / AI기술전략팀
        <strong>우상근</strong>
      </div>
    </section>
  </main>
</body>
</html>
