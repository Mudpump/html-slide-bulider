<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>에이전틱 AI 시대 정책 지원 방향 - Cover</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --color-primary: #F9735B;
    --color-primary-deep: #C2412D;
    --color-primary-soft: #FFE8E1;
    --color-primary-bg: #FFF6F2;
    --color-text: #2A1F1B;
    --color-text-muted: #6B5550;
    --color-text-subtle: #A99690;
    --color-line: #E7D7D0;
    --color-line-soft: #F5ECE8;
    --color-surface: #FFFFFF;
    --color-surface-muted: #FFFAF7;
    --color-page-bg: #EFE6E1;
  }
  html,
  body {
    font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--color-page-bg);
    color: var(--color-text);
    -webkit-font-smoothing: antialiased;
  }
  .deck {
    display: flex;
    justify-content: center;
    padding: 48px 24px;
  }
  .slide {
    width: 1280px;
    max-width: 100%;
    height: 720px;
    background: var(--color-surface);
    border-radius: 24px;
    box-shadow: 0 12px 40px rgba(42, 31, 27, 0.10);
    position: relative;
    overflow: hidden;
  }
  .bg {
    position: absolute;
    inset: -10px;
    background: url("assets/cover_nia.jpg") center / cover no-repeat;
    filter: blur(4px) saturate(0.96);
    transform: scale(1.025);
    opacity: 0.78;
  }
  .overlay {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(105deg, rgba(255, 250, 247, 0.94) 0%, rgba(255, 246, 242, 0.78) 46%, rgba(255, 232, 225, 0.22) 100%),
      radial-gradient(circle at 82% 20%, rgba(249, 115, 91, 0.16), transparent 34%);
  }
  .content {
    position: relative;
    z-index: 1;
    height: 100%;
    padding: 72px 78px 62px;
    display: flex;
    flex-direction: column;
  }
  .brand {
    align-self: flex-end;
    color: var(--color-text-subtle);
    font-size: 12px;
    font-weight: 850;
    letter-spacing: 0.12em;
  }
  .tag {
    margin-top: 62px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    width: fit-content;
    padding: 8px 14px;
    border-radius: 999px;
    background: var(--color-primary-soft);
    color: var(--color-primary-deep);
    font-size: 13px;
    font-weight: 850;
  }
  .tag::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--color-primary);
  }
  h1 {
    margin-top: 26px;
    max-width: 900px;
    font-size: 64px;
    line-height: 1.12;
    font-weight: 900;
    letter-spacing: 0;
  }
  h1 span {
    color: var(--color-primary-deep);
  }
  .subtitle {
    margin-top: 22px;
    max-width: 760px;
    color: var(--color-text-muted);
    font-size: 22px;
    line-height: 1.5;
    font-weight: 650;
  }
  .presenter {
    margin-top: auto;
    align-self: flex-end;
    min-width: 330px;
    border-top: 2px solid var(--color-primary);
    padding-top: 18px;
    text-align: right;
  }
  .presenter .org {
    color: var(--color-text-muted);
    font-size: 17px;
    line-height: 1.6;
    font-weight: 700;
  }
  .presenter .name {
    margin-top: 8px;
    color: var(--color-text);
    font-size: 24px;
    font-weight: 900;
  }
  .slide-num {
    position: absolute;
    left: 78px;
    bottom: 36px;
    color: var(--color-text-subtle);
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.05em;
  }
  .slide-num span { color: var(--color-primary-deep); }
</style>
</head>
<body>
  <main class="deck">
    <section class="slide">
      <div class="bg"></div>
      <div class="overlay"></div>
      <div class="content">
        <div class="brand">NIA · AGENTIC AI POLICY</div>
        <div class="tag">Policy Support Direction</div>
        <h1><span>에이전틱 AI 시대,</span><br>한국지능정보사회진흥원의<br>정책 지원 방향</h1>
        <p class="subtitle">공공 운영 체계가 AI와 함께 일하기 위해 필요한 기준, 기반, 실증, 역량 전환의 방향을 제안합니다.</p>
        <div class="presenter">
          <div class="org">한국지능정보사회진흥원<br>지능기술인프라본부</div>
          <div class="name">우상근 책임</div>
        </div>
      </div>
      <div class="slide-num"><span>00</span> / 02</div>
    </section>
  </main>
</body>
</html>
