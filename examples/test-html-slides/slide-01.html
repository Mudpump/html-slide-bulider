<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML Slide Builder Test - 01</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --color-primary: #3182F6;
    --color-primary-deep: #1B64DA;
    --color-primary-soft: #E8F3FF;
    --color-primary-bg: #F2F8FF;
    --color-text: #191F28;
    --color-text-muted: #4E5968;
    --color-text-subtle: #8B95A1;
    --color-line: #D1D6DB;
    --color-line-soft: #F2F4F6;
    --color-surface: #FFFFFF;
    --color-surface-muted: #F9FAFB;
    --color-page-bg: #E5E8EB;
    --color-success: #00C896;
    --color-warning: #FF7E36;
    --color-violet: #8B5CF6;
  }
  html,
  body {
    font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--color-page-bg);
    color: var(--color-text);
    -webkit-font-smoothing: antialiased;
  }
  .deck {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 24px;
  }
  .slide {
    width: 1280px;
    max-width: 100%;
    height: 720px;
    background: var(--color-surface);
    border-radius: 24px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
    padding: 72px 80px;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .brand {
    position: absolute;
    top: 32px;
    right: 48px;
    font-size: 13px;
    font-weight: 800;
    color: var(--color-line);
    letter-spacing: 0.1em;
  }
  .tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    background: var(--color-primary-soft);
    color: var(--color-primary);
    font-size: 14px;
    font-weight: 800;
    border-radius: 999px;
    width: fit-content;
  }
  .tag::before {
    content: "";
    width: 6px;
    height: 6px;
    background: var(--color-primary);
    border-radius: 50%;
  }
  h1 {
    margin-top: 26px;
    max-width: 900px;
    font-size: 62px;
    font-weight: 850;
    line-height: 1.15;
  }
  .accent { color: var(--color-primary); }
  .lead {
    margin-top: 20px;
    max-width: 760px;
    font-size: 22px;
    line-height: 1.55;
    color: var(--color-text-muted);
    font-weight: 550;
  }
  .cards {
    margin-top: auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  .card {
    min-height: 128px;
    border-radius: 20px;
    padding: 28px 32px;
    background: var(--color-surface-muted);
    border: 1px solid var(--color-line-soft);
  }
  .card.primary {
    background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-deep) 100%);
    color: white;
    border: 0;
    box-shadow: 0 16px 32px rgba(49, 130, 246, 0.25);
  }
  .label {
    margin-bottom: 12px;
    font-size: 13px;
    font-weight: 850;
    color: var(--color-primary);
    letter-spacing: 0.06em;
  }
  .primary .label { color: rgba(255, 255, 255, 0.86); }
  .text {
    font-size: 19px;
    font-weight: 700;
    line-height: 1.45;
  }
  .shape {
    position: absolute;
    width: 340px;
    height: 340px;
    right: -120px;
    top: -130px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--color-primary-soft) 0%, rgba(232, 243, 255, 0) 70%);
    pointer-events: none;
  }
  .slide-num {
    position: absolute;
    right: 48px;
    bottom: 32px;
    font-size: 13px;
    color: var(--color-text-subtle);
    font-weight: 700;
    letter-spacing: 0.05em;
  }
  .slide-num span { color: var(--color-primary); }
</style>
</head>
<body>
  <div class="deck">
    <section class="slide">
      <div class="shape"></div>
      <div class="brand">HTML SLIDE BUILDER</div>
      <div class="tag">Skill Test · 01</div>
      <h1>HTML 발표자료를<br><span class="accent">회사색 기준으로</span><br>빠르게 만듭니다.</h1>
      <p class="lead">팔레트와 디자인 프리셋을 먼저 고정하고, 각 슬라이드는 하나의 메시지가 또렷하게 보이도록 구성합니다.</p>
      <div class="cards">
        <div class="card">
          <div class="label">DEFAULT PALETTE</div>
          <div class="text">Trust Blue를 기본 색감으로 사용해 회사 발표 느낌을 유지합니다.</div>
        </div>
        <div class="card primary">
          <div class="label">DEFAULT DESIGN</div>
          <div class="text">Clean SaaS 스타일로 깔끔하고 신뢰감 있는 슬라이드를 만듭니다.</div>
        </div>
      </div>
      <div class="slide-num"><span>01</span> / 02</div>
    </section>
  </div>
</body>
</html>
